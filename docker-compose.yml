services:
  db:
    image: mysql:9.5.0
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=products
      - MYSQL_USER=gql
      - MYSQL_PASSWORD=gql2025
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u gql -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 50s

  
  app:
    build: .
    restart: always
    ports:
      - "4500:4500"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=gql
      - DB_PASSWORD=gql2025
      - DB_NAME=products
      - DB_PORT=3306
      - PORT=4500
    command: ["sh", "./init.sh"]

volumes:
  mysql_data: